[project]
name = "browser-memory-agent"
version = "0.1.0"
description = "Local browser memory agent that auto-starts on login"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "cryptography>=43.0.0",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "readability-lxml>=0.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
browser-memory = "memory_agent.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_agent*"]

[tool.setuptools.package-data]
memory_agent = ["ui/static/*", "ui/static/**/*"]
